version: '3.8'

services:
  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: orchestration-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - orchestration-network

  # Main orchestration server
  orchestration-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestration-server
    ports:
      - '3000:3000'
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      DB_TYPE: redis
      DB_HOST: redis
      DB_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_MAX_REQUESTS: 100
      AGENT_HEARTBEAT_INTERVAL: 60000
      COMMAND_TIMEOUT: 30000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - orchestration-network
    volumes:
      - ./logs:/app/logs
      - ./certs:/app/certs:ro

  # Optional: PostgreSQL for advanced deployments
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: orchestration-postgres
  #   environment:
  #     POSTGRES_DB: orchestration
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - orchestration-network
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U postgres']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional: Prometheus for metrics
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: orchestration-prometheus
  #   ports:
  #     - '9090:9090'
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   networks:
  #     - orchestration-network

volumes:
  redis-data:
  # postgres-data:
  # prometheus-data:

networks:
  orchestration-network:
    driver: bridge
